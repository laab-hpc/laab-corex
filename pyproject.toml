[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "laab-inspector"
version = "0.1.0"
description = "A tool to prepare performance report from the data generated by the Linear Algebra Aware Benchmarks (LAAB), and visualize them via a dashboard."
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
  "pandas",
  "flask",
  "partial_ranker @ git+https://github.com/HPAC/PartialRanker@v1.1",
  "mgen @ git+https://github.com/laab-hpc/laab-mgen.git",
]

[project.scripts]
laab-process = "laab_inspector.inspector.manage_profiles:laab_process"
laab-delete-profile-entry = "laab_inspector.inspector.manage_profiles:laab_delete_profile_entry"
laab-print-profile = "laab_inspector.inspector.manage_profiles:laab_print_profile"
laab-reprocess = "laab_inspector.inspector.manage_profiles:laab_reprocess"
laab-delete-profiles = "laab_inspector.inspector.manage_profiles:laab_delete_profiles"
laab-collect-profiles = "laab_inspector.dashboard.collect_profiles:laab_collect_profiles"
laab-dashboard = "laab_inspector.dashboard.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]